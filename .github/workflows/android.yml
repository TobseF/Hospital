name: Android APK

on:
  push:
    branches: [ "ccr-81a040f3-did8b5" ]
    tags: [ "android-v*" ]
  pull_request:
    branches: [ "ccr-81a040f3-did8b5" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Hospital.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hospital-apk
          path: Hospital.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Hospital.apk
